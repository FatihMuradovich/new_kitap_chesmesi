plugins {
    id("com.android.application")
    id("kotlin-android")
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id("dev.flutter.flutter-gradle-plugin")
    id("com.google.gms.google-services")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.fatih.kitapchesmesi"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.fatih.kitapchesmesi"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    signingConfigs {
        // key.properties ve keystore repoda değildir (gizli). Dosya yoksa
        // (başka bilgisayar, CI) debug build'ler yine çalışsın diye release
        // imzası yalnızca dosya varken tanımlanır.
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8: kullanılmayan kodu/kaynakları atar, uygulamayı küçültür ve
            // Java/Kotlin tarafını karartır. Dart kodu için build komutunda
            // --obfuscate --split-debug-info kullanın (README / RELEASE notu).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// İmzasız (veya debug imzalı) bir release paketi yanlışlıkla mağazaya
// gitmesin: key.properties yoksa release build açık bir mesajla durur.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (releaseTask && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties bulunamadı: release build imzalanamaz. " +
            "Keystore ve key.properties dosyalarını yerleştirin.")
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
    implementation(platform("com.google.firebase:firebase-bom:34.9.0"))
}
